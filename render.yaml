# Render Blueprint: one web service built from the Dockerfile.
# Create it at https://dashboard.render.com/blueprints (see DEPLOY.md).
services:
  - type: web
    name: rest-route
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Google Maps browser key; Render asks for the value (it is not stored in Git).
      - key: GOOGLE_MAPS_API_KEY
        sync: false
